<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="icon" type="image/x-icon" href="icon.png" />
  <!-- <script src="voice.js"></script> -->
  <script src="helpers.js"></script>
  <script src="sprite.js"></script>
  <script src="grid.js"></script>
  <script src="input.js"></script>
  <style>
    canvas {
      background-color: lightgray;
    }
  </style>
</head>

<body>
  <canvas width="1000" height="700"></canvas>
  <!-- <script src="music.js"></script> -->
  <script>

    const canvas = document.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    const grid = new Grid(10, 7, 100);


    let sprites = [];

    let asset_opts = [
      "assets/I.svg",
      "assets/L.svg",
      "assets/T.svg",
      "assets/X.svg",
      "assets/O.svg",
      "assets/0.svg",
      "assets/C.svg",
      "assets/U.svg",
    ];

    grid.forEach(tile => {

      let random_asset = asset_opts[random(0, asset_opts.length - 1)];
      let ct = tile.getCenter();
      let s = new Sprite(random_asset);
      let size = random_asset.match(/[O0]/) ? 104 : 100;
      size *= .90;
      s.resize(size, size);
      s.position = new Vector(ct.x, ct.y);
      s.direction = random(0, 3) * 90;
      tile.sprite = s;
      sprites.push(s);
    });


    let fm = grid.tiles.flat();
    let selected;

    mouse.start(canvas);

    const dfr = 7;

    let i = 0;
    function loop() {
      setTimeout(loop, 1000 / 60);
      ctx.clearRect(0, 0, canvas.width, canvas.height);


      // grid.draw_boxes();
      for (let s of sprites) s.draw();


      let a_t = grid.getActiveTile();
      if (a_t && mouse.down) {
        a_t.sprite.direction = a_t.sprite.dir + 90;
        mouse.down = false;
      }

      if (i++ % dfr == 0) {
        selected = fm[random(0, fm.length - 1)].sprite;

      }
      selected.direction = selected.dir + (90 / dfr);
    }

    loop();

  </script>
  <!-- <script src="https://open.spotify.com/embed/iframe-api/v1" async></script> -->
  <!-- <div id="embed-iframe"></div> -->
</body>

</html>
